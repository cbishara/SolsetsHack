services:
  app:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: 3001
      DATA_DIR: /app/.data
      HERMES_BASE_URL: http://hermes:8642/v1
    volumes:
      - solsets_data:/app/.data
    restart: unless-stopped

  # El Dockerfile oficial instala Hermes. Commit fijado para reproducibilidad.
  hermes:
    profiles: [agent]
    build:
      context: https://github.com/NousResearch/hermes-agent.git#cb757fac59c92b49e9b8f2910e5cd7ab75efffdd
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_API_KEY:?Configura HERMES_API_KEY en .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hermes_data:/opt/data
    expose:
      - "8642"
    command: ["gateway", "run"]
    restart: unless-stopped

volumes:
  solsets_data:
  hermes_data:
